name: EAS Update (Production)

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        working-directory: frontend
        run: npm install

      - name: Install EAS
        run: npm install -g eas-cli

      - name: Run EAS Update
        working-directory: frontend
        run: eas update --branch production --environment production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}